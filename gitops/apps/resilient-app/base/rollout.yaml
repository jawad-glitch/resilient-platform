apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: resilient-app
spec:
  replicas: 5
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: resilient-app
  template:
    metadata:
      labels:
        app: resilient-app
    spec:
      containers:
        - name: resilient-app
          image: ghcr.io/jawad-glitch/resilient-app:37bd169456bd300a3fe8ee491ce299196ff494f6
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: v2
            - name: ERROR_RATE
              value: "0"
            - name: REGION
              value: unknown
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
  strategy:
    canary:
      canaryService: resilient-app-canary
      stableService: resilient-app-stable
      steps:
        - setWeight: 20
        - analysis:
            templates:
              - templateName: error-rate
            args:
              - name: service
                value: resilient-app-canary
        - setWeight: 60
        - analysis:
            templates:
              - templateName: error-rate
            args:
              - name: service
                value: resilient-app-canary
