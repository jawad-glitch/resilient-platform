global
    log stdout format raw local0

defaults
    mode http
    log global
    timeout connect 2s
    timeout client  10s
    timeout server  10s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

frontend web
    bind *:8080
    default_backend app

backend app
    option httpchk GET /healthz
    http-check expect status 200
    server region-a region-a-control-plane:30080 check inter 2s fall 2 rise 2 resolvers docker init-addr none
    server region-b region-b-control-plane:30080 check inter 2s fall 2 rise 2 resolvers docker init-addr none backup

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s
